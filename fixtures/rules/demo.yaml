# Rules used by the public Lab demo. Same parameters as v0-draft, but hard
# limits keep the "break" level so the demo shows what a rule break looks like.
# Independent of the private rule set.
version: demo-1
status: active
notes: Public Lab demo rules. Not a recommendation.
rules:
  - {code: CORE_TARGET_WEIGHT,         severity: info,  params: {target: 0.70}}
  - {code: SATELLITE_MAX_WEIGHT,       severity: break, params: {max: 0.30}}
  - {code: SINGLE_MAX_WEIGHT_NAV,      severity: break, params: {max: 0.15}}
  - {code: MEMO_REQUIRED_ABOVE,        severity: break, params: {threshold: 0.10, min_status: reviewed}}
  - {code: EXPOSURE_MAX_WEIGHT,        severity: break, params: {max: 0.35, count_core: false}}
  - {code: SINGLE_MAX_WEIGHT_INVESTED, severity: warn,  params: {max: 0.50}}
  - {code: TOP3_MAX_WEIGHT_INVESTED,   severity: warn,  params: {max: 0.90, count_core: false}}
  - {code: LOSS_REVIEW_TRIGGER,        severity: info,  params: {loss_usd: 600}}
  - {code: FIRST_LIVE_MAX_USD,         severity: break, params: {max_usd: 1000}}
  - {code: PAPER_MIN_WEEKS,            severity: warn,  params: {weeks: 6}}
  - {code: PAPER_MIN_REVIEWS,          severity: warn,  params: {reviews: 2}}
  - {code: REVIEW_OVERDUE,             severity: warn,  params: {max_days: 31}}
  - {code: UNCLASSIFIED_POSITION,      severity: warn}
  - {code: MISSING_INVALIDATION,       severity: warn,  params: {min_conditions: 3}}
  - {code: UNCHECKED_TRADE,            severity: warn,  params: {window_days: 7, include_core: false}}
