# Compose override that adds the Investment Lab to the self_web stack.
# Lab releases live in their own directory (default /opt/investment/current), so
# self_web releases and Lab releases can be updated and rolled back separately.
# Run from self_web's deploy directory:
#   docker compose --env-file .env.production -f compose.yaml \
#     -f /opt/investment/current/compose.invest.yaml up -d
#
# Boundaries: investment-api publishes no host port and is not on self_web's
# internal `backend` network (no access to PostgreSQL). It sits on its own
# `invest` network, shared only with Caddy, which also gives it outbound HTTPS
# to sec.gov.
services:
  caddy:
    volumes:
      - ${INVEST_DIR:-/opt/investment/current}/invest.caddy:/etc/caddy/sites/invest.caddy:ro
      - ${INVEST_DIR:-/opt/investment/current}/site:/srv/invest:ro
    networks:
      - invest

  investment-api:
    image: ${INVEST_API_IMAGE:?Set INVEST_API_IMAGE to the prebuilt investment-api image tag}
    restart: unless-stopped
    environment:
      SEC_USER_AGENT: ${SEC_USER_AGENT:?Set SEC_USER_AGENT to "Name email" as SEC requires}
      RATE_PER_MINUTE: ${INVEST_RATE_PER_MINUTE:-60}
      # Public AI skeptic: off unless LAB_SKEPTIC_ENABLED=1 and a key is set (DESIGN §11.4).
      LAB_SKEPTIC_ENABLED: ${LAB_SKEPTIC_ENABLED:-0}
      ANTHROPIC_API_KEY: ${INVEST_ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${INVEST_ANTHROPIC_MODEL:-claude-haiku-4-5}
      LAB_DAILY_BUDGET_USD: ${LAB_DAILY_BUDGET_USD:-0.5}
      LLM_MONTHLY_BUDGET_USD: ${LLM_MONTHLY_BUDGET_USD:-5}
      LAB_SKEPTIC_PER_IP_DAILY: ${LAB_SKEPTIC_PER_IP_DAILY:-3}
      # Lab memo workflow (DESIGN §11.5): on with the skeptic; memos untouched this many days are deleted.
      LAB_MEMO_RETENTION_DAYS: ${LAB_MEMO_RETENTION_DAYS:-180}
      LAB_MEMO_REVIEW_PER_IP_DAILY: ${LAB_MEMO_REVIEW_PER_IP_DAILY:-3}
    volumes:
      - invest_edgar_cache:/data/edgar
      - invest_lab_data:/data/lab
    networks:
      - invest
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  invest: {}

volumes:
  invest_edgar_cache: {}
  invest_lab_data: {}
